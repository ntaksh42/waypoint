# 毎朝 7:00 (JST) に main の最新コミットが前回の nightly ビルドより
# 進んでいれば MSI をビルドし、nightly という pre-release で公開する。
# バージョン番号のタグ運用 (installer.yml, vX.Y.Z) とは独立。
name: nightly

on:
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 = JST 7:00
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare main HEAD with last nightly tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA=$(git rev-parse origin/main)
          LAST_SHA=$(git rev-parse refs/tags/nightly 2>/dev/null || true)
          echo "main=$MAIN_SHA last=$LAST_SHA"
          if [ "$MAIN_SHA" != "$LAST_SHA" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2

      - name: Build MSI
        run: .\installer\build.ps1
        shell: pwsh

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 既存の nightly release / tag があれば削除する (初回は無いので失敗を許容)
          gh release delete nightly --yes --cleanup-tag *>$null
          $global:LASTEXITCODE = 0

          git tag -f nightly
          git push origin nightly --force

          gh release create nightly (Get-Item dist/*.msi).FullName `
            --title "Nightly build ($(git rev-parse --short HEAD))" `
            --notes "main の最新コミット $(git rev-parse HEAD) から自動ビルド。開発版であり安定版ではない。" `
            --prerelease `
            --target main
        shell: pwsh
