# MSI がビルドできることを検証する。
# タグを打った場合は成果物を Release に添付する。
name: installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'installer/**'
      - 'Cargo.toml'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

jobs:
  msi:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2

      - name: Build MSI
        run: .\installer\build.ps1
        shell: pwsh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waypoint-msi
          path: dist/*.msi

  attach-release:
    needs: msi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: waypoint-msi
          path: dist

      # タグを打ったときだけ Release に添付する。Release がまだ無ければ
      # (`gh release upload` は既存 Release への追加専用で「release not found」
      # になるため) 先に作成してからアップロードする。
      - name: Attach to release
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" (Get-Item dist/*.msi).FullName --clobber
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
