# PR と main への push で fmt / clippy / test を検証する。
# 警告をエラー扱いにして「警告 0」の規約を CI で強制する。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build Settings
        run: dotnet build settings\Waypoint.Settings.csproj -c Release

      # build.rs が設定画面を巻き込んでビルドする (exe の隣に置くため)。
      # ここでは 1 つ上で単体ビルド済みなので、二重に走らせない。
      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings
        env:
          WAYPOINT_SKIP_SETTINGS_BUILD: '1'

      - name: Test
        run: cargo test
        env:
          WAYPOINT_SKIP_SETTINGS_BUILD: '1'
