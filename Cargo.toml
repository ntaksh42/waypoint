[package]
name = "waypoint"
version = "0.2.2"
edition = "2024"
description = "ホットキーで呼び出す階層ポップアップランチャー"
license = "MIT"
default-run = "waypoint"

[lib]
name = "waypoint"
path = "src/lib.rs"

[[bin]]
name = "waypoint"
path = "src/main.rs"

[[bin]]
name = "waypoint-settings"
path = "src/settings_main.rs"

[dependencies]
# Win32 API バインディング。必要な feature のみ有効にする
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",    # メニュー・フック・ウィンドウ
  "Win32_UI_Input_KeyboardAndMouse", # RegisterHotKey
  "Win32_UI_Shell",                  # SHGetKnownFolderPath / Shell_NotifyIcon
  "Win32_UI_Shell_Common",           # シェル名前空間項目の PIDL
  "Win32_UI_HiDpi",                  # Per-Monitor V2
  "Win32_System_LibraryLoader",
  "Win32_System_Com",                # エクスプローラー操作 (IShellWindows)
  "Win32_System_Ole",                # COM の VARIANT 操作
  "Win32_System_Variant",            # IShellWindows::Item の引数
  "Win32_System_Threading",          # プロセス名の取得 / 二重起動抑止の Mutex
  "Win32_Security",                  # CreateMutexW の引数型
  "Win32_System_ProcessStatus",      # 同上
  "Win32_System_Registry",           # 自動起動 (FR-8.4)
  "Win32_Graphics_Gdi",              # アイコン描画
  "Win32_Graphics_Dwm",              # Quick Launch のダークタイトルバー・角丸
  "Win32_UI_Controls",               # IImageList (アイコン取得)
  "Win32_Storage_FileSystem",        # SHGetFileInfoW の引数型
  "Win32_System_DataExchange",       # WM_COPYDATA (Everything IPC)
] }
serde = { version = "1", features = ["derive"] }
# preserve_order: 設定ファイルは手編集を想定するため、保存で項目順を入れ替えない
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.17", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
